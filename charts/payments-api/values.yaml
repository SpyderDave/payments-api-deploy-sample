image:
  repository: ghcr.io/example-org/payments-api
  # Always a digest, never a mutable tag. Set by the promote workflows in values-<env>.yaml.
  digest: ""

host: ""        # required, set per environment
secretPath: ""  # required: path in the external secret store

config:
  logLevel: info
  # replicas x dbPoolMax must fit the Postgres connection budget (see docs/DESIGN.md).
  dbPoolMax: 10

autoscaling:
  minReplicas: 3
  maxReplicas: 6
  cpuUtilization: 60

pdb:
  maxUnavailable: 1

# Starting point only; set from a load test. Memory limit == request; no CPU limit
# (avoids CFS throttling hurting tail latency).
resources:
  requests: {cpu: 500m, memory: 384Mi}
  limits: {memory: 384Mi}

ingress:
  className: nginx
  clusterIssuer: letsencrypt

secretStore: platform-secrets # ClusterSecretStore name

networkPolicy:
  dbCidr: 10.0.0.0/16 # managed Postgres; set per environment

batch:
  schedule: "0 4 * * *" # assumed low-traffic window
  timeZone: UTC
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 256Mi}
