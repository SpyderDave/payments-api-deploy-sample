# Secrets come from the external store via External Secrets Operator; nothing sensitive lives in git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payments-api
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: {{ .Values.secretStore }}}
  target: {name: payments-api, creationPolicy: Owner}
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: {{ required "secretPath is required" .Values.secretPath }}, property: database_url}
    - secretKey: PAYMENTS_WEBHOOK_SECRET
      remoteRef: {key: {{ .Values.secretPath }}, property: webhook_secret}
