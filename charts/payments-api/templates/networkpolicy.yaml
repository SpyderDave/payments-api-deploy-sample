apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-api
spec:
  podSelector:
    matchLabels: {{- include "payments-api.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{port: 8000}]
  egress:
    - to: # DNS
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: {{ .Values.networkPolicy.dbCidr }}}}] # managed Postgres
      ports: [{port: 5432}]
---
# Batch pods get the same egress (DB + DNS) and no ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-api-batch
spec:
  podSelector:
    matchLabels: {{- include "payments-api.batchSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: {{ .Values.networkPolicy.dbCidr }}}}]
      ports: [{port: 5432}]
